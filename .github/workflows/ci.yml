name: CI

on:
  # `beta` is gated as well as `main`: it is the long-lived integration branch
  # the /srv pre tier deploys from (srv-pre.sh xemu-cartographer beta), so a
  # direct push there reaches a running tier and must not skip CI.
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

env:
  PUBLIC_PB_PORT: 8090

# Sibling-module layout (step 7 restructure): go.mod has
#   replace github.com/xemu-cartographer/xc-scraper => ../xc-scraper
# so every job that needs Go (backend) or the wire artifacts (frontend's
# "Wire sync check") checks this repo out under ./xemu-cartographer and the
# scraper repo under ./xc-scraper, then works from ./xemu-cartographer.
#
# github.com/xemu-cartographer/xc-scraper is a PRIVATE repository, so the
# default GITHUB_TOKEN (scoped to this repo) cannot read it: the sibling
# checkout steps pass the XC_SCRAPER_CHECKOUT_TOKEN repository secret — a
# fine-grained PAT (resource owner: the xemu-cartographer org, repository
# access: only xc-scraper, permission Contents: read-only). Without the
# secret those two steps fail and the frontend + backend jobs are red; the
# `|| github.token` fallback only matters if the sibling is ever made public.

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xemu-cartographer/sveltekit
    steps:
      - uses: actions/checkout@v4
        with:
          path: xemu-cartographer

      # Sibling checkout: the wire contract's TS mirror + golden fixtures are
      # vendored into sveltekit/src/lib/types (task sync-wire); the check below
      # fails the build when the vendored copies drift from xc-scraper/wire.
      - uses: actions/checkout@v4
        with:
          repository: xemu-cartographer/xc-scraper
          ref: main
          path: xc-scraper
          token: ${{ secrets.XC_SCRAPER_CHECKOUT_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: xemu-cartographer/sveltekit/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Wire sync check
        # Same commands as `task sync-wire:check` (Taskfile.yml); run from the
        # repo root so the paths match the Taskfile.
        working-directory: xemu-cartographer
        run: |
          diff -u ../xc-scraper/wire/ts/scraper-v2.ts sveltekit/src/lib/types/scraper-v2.ts \
            || { echo "sveltekit/src/lib/types/scraper-v2.ts is stale — run task sync-wire"; exit 1; }
          diff -ru ../xc-scraper/wire/testdata sveltekit/src/lib/types/wire-fixtures \
            || { echo "sveltekit/src/lib/types/wire-fixtures/ is stale — run task sync-wire"; exit 1; }

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pb_public
          path: xemu-cartographer/pb_public/
          retention-days: 1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xemu-cartographer
    steps:
      - uses: actions/checkout@v4
        with:
          path: xemu-cartographer

      # Sibling checkout so go.mod's `replace => ../xc-scraper` resolves.
      - uses: actions/checkout@v4
        with:
          repository: xemu-cartographer/xc-scraper
          ref: main
          path: xc-scraper
          token: ${{ secrets.XC_SCRAPER_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: xemu-cartographer/go.mod
          cache-dependency-path: |
            xemu-cartographer/go.sum
            xc-scraper/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        # Scoped to ./cmd/... ./internal/... (mirrors Taskfile `test`) to skip
        # the root-owned containers/ mount. Makes the 58 existing test files
        # load-bearing on every push/PR.
        run: go test ./cmd/... ./internal/...

      - name: Race
        # The two packages with real goroutine choreography (DESIGN-STEP8 §13):
        # the WS hub's room observer / eviction / async request handlers and
        # the xc-scraper stream client (mirror, demand, rebroadcast). The
        # race runs against a real xc/hub + xc/daemon booted in-process.
        run: go test -race ./internal/websocket/... ./internal/xcclient/...

      - name: Build
        run: CGO_ENABLED=0 go build -o bin/server ./cmd/server

      - name: Build xc-scraper
        # Same as `task build:scraper`: the daemon is a first-class tier
        # artifact next to bin/server (built from the sibling checkout).
        working-directory: xc-scraper
        run: CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=ci-${GITHUB_SHA::7}" -o ../xemu-cartographer/bin/xc-scraper ./cmd/xc-scraper

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: frontend
    # The suite takes ~30 s. Playwright's runner awaits a stopping worker's
    # exit with no watchdog (ProcessHost.stop), so a wedged browser teardown
    # hangs the job until GitHub's 6 h limit (2026-09-21, run 35657730454,
    # twice). Fail fast instead.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: xemu-cartographer/sveltekit
    steps:
      # No sibling checkout here: e2e only needs the built pb_public/ artifact.
      - uses: actions/checkout@v4
        with:
          path: xemu-cartographer

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: xemu-cartographer/sveltekit/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: pb_public
          path: xemu-cartographer/pb_public/

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        # `list` on top of the config's `html`: the reporter Playwright adds on
        # CI (dot) never emits a newline, so GitHub's line-buffered log shows
        # nothing between "Running N tests" and the summary — a hang leaves no
        # trace of which test it was in. DEBUG streams every API call and the
        # browser's stderr the same way.
        run: pnpm test:e2e --reporter=list,html
        env:
          DEBUG: pw:api,pw:browser

      - name: Upload test report
        # always(): a timed-out job counts as cancelled, and that is exactly
        # when the per-test traces in test-results/ matter.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            xemu-cartographer/sveltekit/playwright-report/
            xemu-cartographer/sveltekit/test-results/
          retention-days: 7
